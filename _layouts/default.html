---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="{% if page.url == '/' %}cc-home cc-minimal{% elsif page.url contains '/publications' %}cc-research cc-minimal{% elsif page.collection == 'publications' %}cc-pub-detail cc-minimal{% elsif page.cc_minimal %}cc-text cc-minimal{% endif %}">

    <!-- Court-line motif: faint cream sidelines framing the column -->
    <div class="cc-court-lines" aria-hidden="true"></div>

    <!-- Vizzy — line-art signature mascot (blueprint style) -->
    <svg class="cc-signature" viewBox="0 0 72 92" xmlns="http://www.w3.org/2000/svg"
         fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round"
         role="img" aria-label="Vizzy, a small robot">
      <!-- Antenna -->
      <line x1="36" y1="6" x2="36" y2="14"/>
      <circle cx="36" cy="4.5" r="2.4" fill="currentColor" stroke="none"/>
      <!-- Head -->
      <rect x="20" y="14" width="32" height="26" rx="9"/>
      <circle cx="30" cy="27" r="2.2" fill="currentColor" stroke="none"/>
      <circle cx="42" cy="27" r="2.2" fill="currentColor" stroke="none"/>
      <line x1="31" y1="34" x2="41" y2="34"/>
      <!-- Neck -->
      <line x1="36" y1="40" x2="36" y2="45"/>
      <!-- Body -->
      <rect x="23" y="45" width="26" height="25" rx="7"/>
      <!-- Right arm -->
      <path d="M49 53 H59"/>
      <!-- Left arm reaching to hold a tennis ball -->
      <path d="M23 53 H14"/>
      <circle cx="9" cy="56" r="5"/>
      <path d="M5.5 53 C8 56 8 56 5.5 59"/>
      <path d="M12.5 53 C10 56 10 56 12.5 59"/>
      <!-- Legs + feet -->
      <path d="M31 70 V82 H26"/>
      <path d="M41 70 V82 H46"/>
    </svg>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
