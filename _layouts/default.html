---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    <!-- Background floating decorations -->
    <div class="bg-floats" aria-hidden="true">
      <!-- Tennis balls -->
      <svg class="bg-ball-1" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="25" r="23" fill="#c8e020" stroke="#a8bb00" stroke-width="1"/>
        <path d="M17 4 C23 16, 23 34, 17 46" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M33 4 C27 16, 27 34, 33 46" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <svg class="bg-ball-2" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="25" r="23" fill="#c8e020" stroke="#a8bb00" stroke-width="1"/>
        <path d="M17 4 C23 16, 23 34, 17 46" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M33 4 C27 16, 27 34, 33 46" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <!-- Mini robots -->
      <!-- Walking robot (side profile, mid-stride) -->
      <svg class="bg-robot-1" viewBox="0 0 36 52" xmlns="http://www.w3.org/2000/svg">
        <!-- Antenna -->
        <line x1="18" y1="1" x2="18" y2="5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="0.5" r="1.8" fill="currentColor"/>
        <!-- Head (round) -->
        <circle cx="18" cy="13" r="10" fill="currentColor"/>
        <!-- Single side eye -->
        <circle cx="22" cy="12" r="3.5" fill="#0d1117"/>
        <circle cx="23.2" cy="10.8" r="1.2" fill="#00efc0"/>
        <!-- Body -->
        <ellipse cx="18" cy="33" rx="10.5" ry="9.5" fill="currentColor" opacity="0.85"/>
        <!-- Arm front (swung back/up) -->
        <line x1="8" y1="29" x2="2" y2="22" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
        <!-- Arm back (swung forward/down) -->
        <line x1="28" y1="29" x2="34" y2="35" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
        <!-- Leg front (stepped forward) -->
        <line x1="13" y1="41" x2="9" y2="52" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" opacity="0.78"/>
        <!-- Leg back (pushed back) -->
        <line x1="23" y1="41" x2="27" y2="52" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" opacity="0.62"/>
      </svg>
      <!-- Jumping robot (front-facing, arms raised) -->
      <svg class="bg-robot-2" viewBox="0 0 38 50" xmlns="http://www.w3.org/2000/svg">
        <!-- Antenna -->
        <line x1="19" y1="0" x2="19" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="19" cy="-0.5" r="1.8" fill="currentColor"/>
        <!-- Head (round) -->
        <circle cx="19" cy="13" r="11" fill="currentColor"/>
        <!-- Visor -->
        <rect x="11" y="8" width="16" height="9" rx="4.5" fill="#0d1117"/>
        <!-- Eyes -->
        <circle cx="15.5" cy="12.5" r="2.8" fill="#00efc0"/>
        <circle cx="22.5" cy="12.5" r="2.8" fill="#00efc0"/>
        <!-- Body -->
        <ellipse cx="19" cy="33" rx="11" ry="10" fill="currentColor" opacity="0.85"/>
        <!-- Arms raised (celebrating) -->
        <line x1="8"  y1="27" x2="1"  y2="17" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
        <line x1="30" y1="27" x2="37" y2="17" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
        <!-- Legs (tucked for jump) -->
        <line x1="14" y1="42" x2="10" y2="51" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" opacity="0.78"/>
        <line x1="24" y1="42" x2="28" y2="51" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" opacity="0.63"/>
      </svg>
    </div>

    <!-- Vizzy — corner mascot (big head, small body, pill limbs) -->
    <svg class="vizzy-corner" viewBox="0 0 72 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vizzy the robot">
      <!-- Antenna -->
      <line x1="36" y1="5" x2="36" y2="11" stroke="#00d4aa" stroke-width="2.2" stroke-linecap="round"/>
      <circle class="antenna-dot" cx="36" cy="3.5" r="3" fill="#00d4aa"/>
      <!-- Head (big, sits on body) -->
      <circle cx="36" cy="27" r="21" fill="#00d4aa"/>
      <!-- Visor -->
      <rect x="19" y="20" width="34" height="14" rx="7" fill="#0d1117"/>
      <!-- Eyes -->
      <circle class="vizzy-eye" cx="28" cy="27" r="4.5" fill="#00efc0"/>
      <circle class="vizzy-eye" cx="44" cy="27" r="4.5" fill="#00efc0"/>
      <!-- Eye highlights -->
      <circle cx="29.5" cy="25.2" r="1.5" fill="white" opacity="0.55"/>
      <circle cx="45.5" cy="25.2" r="1.5" fill="white" opacity="0.55"/>
      <!-- Body (smaller, sits below head) -->
      <ellipse cx="36" cy="65" rx="18" ry="15" fill="#009980"/>
      <!-- V emblem -->
      <path d="M28 58 L36 68 L44 58" fill="none" stroke="#00d4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Arms (horizontal pill, extending from body sides) -->
      <rect x="0"  y="60" width="20" height="11" rx="5.5" fill="#009980"/>
      <rect x="52" y="60" width="20" height="11" rx="5.5" fill="#009980"/>
      <!-- Legs (vertical pill, descending from body bottom) -->
      <rect x="20" y="75" width="12" height="20" rx="6" fill="#007a63"/>
      <rect x="40" y="75" width="12" height="20" rx="6" fill="#ff6b35"/>
    </svg>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
