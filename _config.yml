# Site Settings
locale                   : "en-US"
site_theme               : "air"
title                    : "Vishal Reddy Mandadi"
title_separator          : "-"
name                     : &name "Vishal Reddy Mandadi"
description              : &description "Robotics researcher at IIIT Hyderabad working on motion planning, generative models, and robot learning."
url                      : "https://vishal-2000.github.io"
baseurl                  : ""
repository               : "vishal-2000/vishal-2000.github.io"

# Author — controls sidebar
author:
  avatar           : "profile.jpg"
  name             : "Vishal Reddy Mandadi"
  bio              : "MS Robotics @ CMU. Robot learning & physics engines with Prof. Deepak Pathak."
  location         : "Pittsburgh, PA"
  employer         : "Carnegie Mellon University"
  email            : "vishalreddypro2000@gmail.com"

  # Academic
  googlescholar    : "https://scholar.google.com/citations?user=RGEhkt4AAAAJ"
  arxiv            :

  # Code
  github           : "vishal-2000"

  # Social
  twitter          : "VishalMandadi"
  linkedin         : "vishal-reddy-mandadi-8675a31a7"
  instagram        : "vishal_mandadi"

# Publication categories
publication_category:
  conferences:
    title: 'Conference Papers'
  manuscripts:
    title: 'Journal Articles'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
atom_feed:
  hide                   : true

# SEO
google_site_verification :

# Social sharing
twitter:
  username               : "VishalMandadi"
og_image                 : "images/profile.jpg"

# Analytics
analytics:
  provider               : "false"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Dockerfile
  - Gemfile
  - LICENSE
  - node_modules
  - package.json*
  - README
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false
      share: false
      comments: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
